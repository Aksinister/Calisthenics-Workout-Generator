<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calisthenics workout generator</title>
    <link rel="stylesheet" href="index.css" />
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Calisthenics Workout Generator</h1>
      </header>
      <section id="inputSection">
        <form id="inputForm">
          <input
            type="text"
            placeholder="Enter a focus for your workout"
            autofocus
            required
            autocomplete="off"
            id="input"
          />
          <input type="submit" id="submitButton" />
        </form>
        <div id="examples">i.e: Legs, Core, Full-Body</div>
      </section>
      <section class="hide" id="workout">
        <div id="printed-workout"></div>
      </section>
      <footer>
        This project was coded by
        <a href="https://github.com/Aksinister">Aksinia</a>, is open-sourced on
        <a
          href="https://github.com/Aksinister/Calisthenics-Workout-Generator"
          target="_blank"
          >Github</a
        >
        and is hosted by
        <a
          href="https://calisthenicsworkoutgenerator.netlify.app/"
          target="_blank"
          >Netlify</a
        >
      </footer>
      <script src="index.js"></script>
    </div>
  </body>
</html>
